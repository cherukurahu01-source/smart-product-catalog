---
spring:
  config.activate.on-profile: default

cds:
  ai.chat.models:
    llm:
      kind: mocked
      model: mocked

---
management:
  endpoint:
    health:
      show-components: always
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  health:
    defaults:
      enabled: false
    ping:
      enabled: true
    db:
      enabled: true